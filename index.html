<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presupuesto de trabajos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 12px; color: #222; }
  h1 { color: #2e6b30; }
  fieldset { border: 1px solid #ccc; border-radius: 6px; margin-bottom: 16px; padding: 12px; }
  legend { font-weight: bold; padding: 0 6px; }
  label { display: block; font-size: 14px; margin: 6px 0 2px; }
  input, select, textarea { width: 100%; padding: 6px; box-sizing: border-box; font-size: 14px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { border-bottom: 1px solid #ddd; padding: 6px; text-align: left; font-size: 14px; vertical-align: middle; }
  td input, td select { padding: 4px; }
  .num { text-align: right; }
  .totales { text-align: right; margin-top: 12px; font-size: 15px; line-height: 1.7; }
  button { padding: 8px 14px; margin-top: 8px; cursor: pointer; }
  .primary { background: #2e6b30; color: #fff; border: none; border-radius: 4px; font-size: 15px; }
</style>
</head>
<body>

<h1>Presupuesto de trabajos</h1>

<fieldset>
  <legend>Datos del cliente</legend>
  <div class="row">
    <div><label>Cliente</label><input id="cliente"></div>
    <div><label>Dirección</label><input id="direccion"></div>
    <div><label>Teléfono</label><input id="telefono"></div>
  </div>
</fieldset>

<fieldset>
  <legend>Datos del presupuesto</legend>
  <div class="row">
    <div><label>Número</label><input id="numero" value="001"></div>
    <div><label>Fecha</label><input type="date" id="fecha"></div>
    <div><label>Validez (días)</label><input type="number" id="validez" value="15"></div>
  </div>
</fieldset>

<fieldset>
  <legend>Trabajos</legend>
  <table>
    <thead>
      <tr>
        <th>Servicio</th>
        <th class="num">Cantidad</th>
        <th>Unidad</th>
        <th class="num">Precio unit.</th>
        <th class="num">Subtotal</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="items"></tbody>
  </table>
  <button onclick="agregarItem()">+ Agregar trabajo</button>
</fieldset>

<fieldset>
  <legend>Ajustes y observaciones</legend>
  <div class="row">
    <div><label>Descuento (%)</label><input type="number" id="descuento" value="0" min="0" oninput="calcular()"></div>
    <div>
      <label>Incluir IVA (21%)</label>
      <select id="iva" onchange="calcular()">
        <option value="no">No</option>
        <option value="si">Sí</option>
      </select>
    </div>
  </div>
  <label>Observaciones (condiciones de pago, plazos, qué incluye y qué no)</label>
  <textarea id="obs" rows="3"></textarea>
</fieldset>

<div class="totales">
  <div>Subtotal: $ <span id="subtotal">0,00</span></div>
  <div>Descuento: -$ <span id="montoDesc">0,00</span></div>
  <div>IVA: $ <span id="montoIva">0,00</span></div>
  <div><strong>Total: $ <span id="total">0,00</span></strong></div>
</div>

<button class="primary" onclick="generarPDF()">Generar PDF</button>
<button onclick="limpiarCampos()">Limpiar campos</button>

  function fmt(n) {
    return Number(n || 0).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function agregarItem() {
    const tr = document.createElement('tr');
    const opts = SERVICIOS.map((s, i) => `<option value="${i}">${s.nombre}</option>`).join('');
    tr.innerHTML = `
      <td><select class="srv" onchange="cambiarServicio(this)"><option value="">Elegir...</option>${opts}</select></td>
      <td><input type="number" min="0" step="any" class="cant" oninput="calcular()"></td>
      <td class="unid">-</td>
      <td><input type="number" min="0" step="any" class="precio" oninput="calcular()"></td>
      <td class="num sub">0,00</td>
      <td><button onclick="this.closest('tr').remove(); calcular()">✕</button></td>
    `;
    document.getElementById('items').appendChild(tr);
  }

  function cambiarServicio(sel) {
    const tr = sel.closest('tr');
    const s = SERVICIOS[sel.value];
    tr.querySelector('.unid').textContent = s ? s.unidad : '-';
    calcular();
  }

  function calcular() {
    let subtotal = 0;
    document.querySelectorAll('#items tr').forEach(tr => {
      const c = parseFloat(tr.querySelector('.cant').value) || 0;
      const p = parseFloat(tr.querySelector('.precio').value) || 0;
      const s = c * p;
      subtotal += s;
      tr.querySelector('.sub').textContent = fmt(s);
    });
    const pctDesc = parseFloat(document.getElementById('descuento').value) || 0;
    const desc = subtotal * pctDesc / 100;
    const base = subtotal - desc;
    const iva = document.getElementById('iva').value === 'si' ? base * 0.21 : 0;
    const total = base + iva;

    document.getElementById('subtotal').textContent = fmt(subtotal);
    document.getElementById('montoDesc').textContent = fmt(desc);
    document.getElementById('montoIva').textContent = fmt(iva);
    document.getElementById('total').textContent = fmt(total);
    return { subtotal, desc, iva, total };
  }

  function generarPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    const numero = document.getElementById('numero').value;
    const fechaRaw = document.getElementById('fecha').value;
    const fecha = fechaRaw ? fechaRaw.split('-').reverse().join('/') : '';
    const validez = document.getElementById('validez').value;
    const cliente = document.getElementById('cliente').value;
    const direccion = document.getElementById('direccion').value;
    const telefono = document.getElementById('telefono').value;
    const obs = document.getElementById('obs').value;

    // Encabezado
    let y = 20;
    if (EMPRESA.logo) {
      doc.addImage(EMPRESA.logo, 'PNG', 14, 8, 30, 23.8);
    }
    doc.setFont(undefined, 'bold');
    doc.setFontSize(16);
    doc.setTextColor(46, 107, 48);
    doc.text(EMPRESA.nombre, 50, y);
    y += 6;
    doc.setFont(undefined, 'normal');
    doc.setFontSize(9);
    doc.setTextColor(0, 0, 0);
    doc.text(`Tel: ${EMPRESA.telefono}  |  ${EMPRESA.email}`, 50, y);
    y += 14;
    doc.setFont(undefined, 'bold');
    doc.setFontSize(18);
    doc.setTextColor(46, 107, 48);
    doc.text(`PRESUPUESTO N° ${numero}`, 14, y);
    y += 9;

    doc.setFont(undefined, 'normal');
    doc.setFontSize(10);
    doc.setTextColor(0, 0, 0);
    doc.text(`Fecha: ${fecha}`, 14, y); y += 5;
    doc.text(`Validez: ${validez} días`, 14, y); y += 8;

    doc.text(`Cliente: ${cliente}`, 14, y); y += 5;
    if (direccion) { doc.text(`Dirección: ${direccion}`, 14, y); y += 5; }
    if (telefono) { doc.text(`Teléfono: ${telefono}`, 14, y); y += 5; }
    y += 6;

    // Encabezado de tabla
    const colServ = 14, colCant = 110, colUnid = 128, colPrecio = 160, colSub = 196;
    doc.setFont(undefined, 'bold');
    doc.text('Servicio', colServ, y);
    doc.text('Cant.', colCant, y, { align: 'right' });
    doc.text('Unidad', colUnid, y);
    doc.text('Precio unit.', colPrecio, y, { align: 'right' });
    doc.text('Subtotal', colSub, y, { align: 'right' });
    y += 2;
    doc.line(14, y, 196, y);
    y += 6;

    // Filas
    doc.setFont(undefined, 'normal');
    document.querySelectorAll('#items tr').forEach(tr => {
      const sel = tr.querySelector('.srv');
      if (!sel || sel.value === '') return;
      const nombre = sel.options[sel.selectedIndex].text;
      const cant = parseFloat(tr.querySelector('.cant').value) || 0;
      const precio = parseFloat(tr.querySelector('.precio').value) || 0;
      const unidad = tr.querySelector('.unid').textContent;

      if (y > 265) { doc.addPage(); y = 20; }

      const lineas = doc.splitTextToSize(nombre, 90);
      doc.text(lineas, colServ, y);
      doc.text(fmt(cant), colCant, y, { align: 'right' });
      doc.text(unidad, colUnid, y);
      doc.text(fmt(precio), colPrecio, y, { align: 'right' });
      doc.text(fmt(cant * precio), colSub, y, { align: 'right' });
      y += 6 * lineas.length + 2;
    });

    // Totales
    const t = calcular();
    if (y > 240) { doc.addPage(); y = 20; }
    y += 4;
    doc.line(120, y, 196, y);
    y += 6;
    doc.text('Subtotal:', 160, y, { align: 'right' }); doc.text(`$ ${fmt(t.subtotal)}`, 196, y, { align: 'right' }); y += 6;
    if (t.desc > 0) {
      doc.text('Descuento:', 160, y, { align: 'right' }); doc.text(`-$ ${fmt(t.desc)}`, 196, y, { align: 'right' }); y += 6;
    }
    if (t.iva > 0) {
      doc.text('IVA (21%):', 160, y, { align: 'right' }); doc.text(`$ ${fmt(t.iva)}`, 196, y, { align: 'right' }); y += 6;
    }
    doc.setFont(undefined, 'bold');
    doc.text('TOTAL:', 160, y, { align: 'right' }); doc.text(`$ ${fmt(t.total)}`, 196, y, { align: 'right' }); y += 10;

    // Observaciones
    if (obs.trim()) {
      doc.setFont(undefined, 'bold');
      doc.text('Observaciones:', 14, y); y += 6;
      doc.setFont(undefined, 'normal');
      const lineasObs = doc.splitTextToSize(obs, 180);
      doc.text(lineasObs, 14, y);
    }

    doc.save(`presupuesto_${numero}.pdf`);
  }

  // Guardado automático: los datos quedan en este navegador aunque se cierre la página
  const CLAVE = 'presupuesto_borrador';
  const CAMPOS = ['cliente', 'direccion', 'telefono', 'numero', 'fecha', 'validez', 'descuento', 'iva', 'obs'];

  function guardar() {
    const datos = {};
    CAMPOS.forEach(id => datos[id] = document.getElementById(id).value);
    datos.items = [...document.querySelectorAll('#items tr')].map(tr => ({
      srv: tr.querySelector('.srv').value,
      cant: tr.querySelector('.cant').value,
      precio: tr.querySelector('.precio').value
    }));
    try { localStorage.setItem(CLAVE, JSON.stringify(datos)); } catch (e) {}
  }

  function cargar() {
    let datos = null;
    try { datos = JSON.parse(localStorage.getItem(CLAVE)); } catch (e) {}
    if (!datos) return false;

    CAMPOS.forEach(id => { if (datos[id] !== undefined) document.getElementById(id).value = datos[id]; });
    document.getElementById('items').innerHTML = '';
    (datos.items || []).forEach(it => {
      agregarItem();
      const tr = document.querySelector('#items tr:last-child');
      tr.querySelector('.srv').value = it.srv;
      tr.querySelector('.cant').value = it.cant;
      tr.querySelector('.precio').value = it.precio;
      cambiarServicio(tr.querySelector('.srv'));
    });
    return true;
  }

  function limpiarCampos() {
    if (!confirm('¿Borrar todos los datos del presupuesto?')) return;
    try { localStorage.removeItem(CLAVE); } catch (e) {}
    ['cliente', 'direccion', 'telefono', 'obs'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('numero').value = '001';
    document.getElementById('validez').value = '15';
    document.getElementById('descuento').value = '0';
    document.getElementById('iva').value = 'no';
    document.getElementById('fecha').valueAsDate = new Date();
    document.getElementById('items').innerHTML = '';
    agregarItem();
    calcular();
  }

  // Inicio
  if (!cargar()) {
    document.getElementById('fecha').valueAsDate = new Date();
  }
  if (document.querySelectorAll('#items tr').length === 0) {
    agregarItem();
  }
  calcular();

  // Cada cambio en cualquier campo se guarda
  document.addEventListener('input', guardar);
  document.addEventListener('change', guardar);
</script>

</body>
</html>
